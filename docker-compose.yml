services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transactionguard-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transactionguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend